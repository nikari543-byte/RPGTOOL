name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Create Flutter project
        run: flutter create --project-name rpgtool rpgtool

      - name: Use custom main.dart
        run: cp main.dart rpgtool/lib/main.dart

      - name: Build release APK
        run: |
          cd rpgtool
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpgtool-apk
          path: rpgtool/build/app/outputs/flutter-apk/app-release.apk
